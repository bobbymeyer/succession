# Build the print deck and publish it as a GitHub release, so the download
# link in docs/CARDS.md and the README
#   https://github.com/<owner>/<repo>/releases/latest/download/succession-print-deck.zip
# always serves the cards as main prints them. The same release carries the
# print-and-play PDFs (the rulebook and every card, nine to a page) and the
# rulebook on its own, for A4 and Letter.
#
# It runs on its own whenever main changes something that is printed on a
# card -- the card text, the layout or the cards themselves -- and can be run
# by hand from the Actions tab: do that after uploading new art to the art
# release, which is not in git and so starts no run of its own.

name: Print deck release

on:
  push:
    branches: [main]
    paths:
      - "tools/mpcfill.py"
      - "tools/sigil.py"
      - "tools/card_text.py"
      - "tools/rulebook.py"
      - "tools/cardsheet.py"
      - "tools/boardsheet.py"
      - "succession/cards.py"
      - "succession/courtiers.py"
      - "succession/enums.py"
      - "succession/state.py"
      - "succession/webapi.py"
      - ".github/workflows/print-deck.yml"
  workflow_dispatch:

permissions:
  contents: write # to create the release

concurrency:
  group: print-deck
  cancel-in-progress: false

jobs:
  release:
    name: Build and release the print deck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Pillow and the card fonts
        # The cards in the repository were drawn in DejaVu Serif (regular,
        # bold) and Liberation Serif Italic; DejaVu's own italics would be
        # picked first, so they go.
        run: |
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-liberation
          sudo apt-get remove -y fonts-dejavu-extra || true
          python -c "import sys; sys.path.insert(0, 'tools'); from mpcfill import Fonts; f = Fonts(); print(f.regular, f.bold, f.italic, sep='\n')"
      - name: The card art, from the art release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/fetch_art.py --quiet
      - name: Build the deck, the print-and-play sheets and the rulebook
        run: python tools/mpcfill.py --profile print,sheets --zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(git rev-parse --short HEAD)
          day=$(date -u +%Y-%m-%d)
          tag="print-deck-${day}-${short}"
          notes="The deck as of ${short}. To print at home: succession-print-and-play-letter.pdf (or -a4), the rules and every card nine to a page. To order from MakePlayingCards: succession-print-deck.zip, every card at 600 DPI with bleed and the MPC Autofill order (see HOW TO PRINT.txt inside). The rules alone: succession-rules-letter.pdf (or -a4)."
          files="build/succession-print-deck.zip build/succession-print-and-play-a4.pdf build/succession-print-and-play-letter.pdf build/succession-rules-a4.pdf build/succession-rules-letter.pdf"
          # Run again the same day on the same commit (say, after uploading
          # new art): the deck in that day's release is replaced.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files \
              --target "$GITHUB_SHA" \
              --title "Print deck ${day} (${short})" \
              --notes "$notes" \
              --latest
          fi
